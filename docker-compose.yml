services:
  sp-monitor:
    build: .
    image: sp-tobacco-monitor-sp-monitor:latest
    container_name: sp-tobacco-monitor
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
